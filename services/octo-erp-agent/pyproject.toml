[project]
name = "octo-erp-agent"
version = "0.1.0"
description = "Dominio del agente de IA de Octo ERP: reglas de negocio, repositorio Cosmos DB, servidor MCP custom."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "azure-cosmos>=4.7.0",
    "azure-identity>=1.19.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octo_erp_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
