[project]
name = "octo-erp-agent"
version = "0.1.0"
description = "Dominio del agente de IA de Octo ERP: reglas de negocio, repositorio Cosmos DB, servidor MCP custom."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "azure-cosmos>=4.7.0",
    "azure-identity>=1.19.0",
    # azure-functions 2.x requiere Python >=3.13; el Function App corre PYTHON|3.12
    # (ver infra/main.bicep) — mismo techo que ya documentó oraculo/infra/README.md tras
    # pisar este error (503 persistente por el mismo desajuste de versión).
    "azure-functions>=1.21.0,<2.0.0",
    "python-dotenv>=1.0.1",
    "openai>=1.50.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/octo_erp_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
