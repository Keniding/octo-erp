name: octo-erp-agent CD

# Despliega infra/main.bicep (Cosmos DB serverless + Function App, ver ese archivo) y
# publica el código del servidor MCP. Requiere que el service principal de OIDC
# (AZURE_CLIENT_ID) tenga el rol Contributor sobre el resource group de destino —
# ver docs/decisions/006-ci-cd-azure-oidc.md, sección "Pendiente de tu lado" si este
# workflow falla con un error de autorización.
on:
  push:
    branches:
      - claude/tender-faraday-fyyif3
    paths:
      - "services/octo-erp-agent/**"
      - ".github/workflows/octo-erp-agent-cd.yml"
  workflow_dispatch: {}

concurrency:
  group: octo-erp-agent-cd
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/octo-erp-agent

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # azure/arm-deploy@v2 no maneja bien un parámetro de tipo array pasado inline como
      # key=value (le rompe las comillas del JSON) — az deployment group create directo sí.
      # location=eastus explícito: la suscripción no tiene cuota de Function App Consumption
      # (Y1) en eastus2, que es la región "default" del resource group (ver decisión 006).
      - run: |
          az deployment group create \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -f infra/main.bicep \
            -p dataContributorPrincipalIds='${{ vars.DATA_CONTRIBUTOR_PRINCIPAL_IDS }}' \
               location="${{ vars.AZURE_LOCATION }}" \
               corsAllowedOrigins="${{ vars.CORS_ALLOWED_ORIGINS }}"

  deploy-code:
    runs-on: ubuntu-latest
    needs: deploy-infra
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Azure/functions-action, autenticado por RBAC/OIDC (no publish profile) contra un
      # Function App Linux Consumption, usa el modo "Run From Package" y NO corre ningún
      # build remoto — scm-do-build-during-deployment/enable-oryx-build se ignoran en ese
      # camino (confirmado con el log real del primer intento: solo zipea el código fuente
      # sin instalar nada). Por eso las dependencias se instalan aquí, en el runner, antes
      # de empaquetar — mismo patrón que documenta Microsoft para Python + RBAC + Linux
      # Consumption. Ver docs/decisions/007-rest-api-para-apps-web.md.
      - name: Instalar dependencias dentro del paquete a desplegar
        run: pip install --target="./.python_packages/lib/site-packages" -r requirements.txt
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: services/octo-erp-agent
          respect-funcignore: true
