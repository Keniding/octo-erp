name: octo-erp-agent CD

# Despliega infra/main.bicep (Cosmos DB serverless + Function App, ver ese archivo) y
# publica el código del servidor MCP. Requiere que el service principal de OIDC
# (AZURE_CLIENT_ID) tenga el rol Contributor sobre el resource group de destino —
# ver docs/decisions/006-ci-cd-azure-oidc.md, sección "Pendiente de tu lado" si este
# workflow falla con un error de autorización.
on:
  push:
    branches:
      - claude/tender-faraday-fyyif3
    paths:
      - "services/octo-erp-agent/**"
      - ".github/workflows/octo-erp-agent-cd.yml"
  workflow_dispatch: {}

concurrency:
  group: octo-erp-agent-cd
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/octo-erp-agent

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # azure/arm-deploy@v2 no maneja bien un parámetro de tipo array pasado inline como
      # key=value (le rompe las comillas del JSON) — az deployment group create directo sí.
      # location=eastus explícito: la suscripción no tiene cuota de Function App Consumption
      # (Y1) en eastus2, que es la región "default" del resource group (ver decisión 006).
      # NO se pasan corsAllowedOrigins/applicationInsightsConnectionString — ver
      # docs/decisions/007-rest-api-para-apps-web.md, "El deploy no era
      # reproducible/determinístico": cambiar CUALQUIER app setting antes de un deploy
      # dispara fallas intermitentes de sync-trigger en esta suscripción. El Bicep ya no
      # declara esos app settings, así que este deploy de infra es estable (mismo puñado
      # de settings siempre, nunca cambia entre corridas).
      - run: |
          az deployment group create \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -f infra/main.bicep \
            -p dataContributorPrincipalIds='${{ vars.DATA_CONTRIBUTOR_PRINCIPAL_IDS }}' \
               location="${{ vars.AZURE_LOCATION }}" \
               computeLocation="${{ vars.AZURE_COMPUTE_LOCATION }}"

  deploy-code:
    runs-on: ubuntu-latest
    needs: deploy-infra
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Azure/functions-action@v1 usa SIEMPRE el camino "Run From Package" vía blob+SAS
      # cuando detecta auth RBAC/OIDC (no publish profile) contra Linux Consumption — ese
      # camino falló consistentemente en el sync-trigger (confirmado con más de 15 runs
      # reales, incluso en Function Apps recién creadas, ver decisión 007). Azure Functions
      # Core Tools (`func azure functionapp publish`), que hace un build remoto real vía
      # Oryx sobre la misma sesión de `az login`/OIDC, sí funciona de forma confiable —
      # confirmado con un despliegue incremental controlado paso a paso.
      - name: Instalar Azure Functions Core Tools
        run: npm install -g azure-functions-core-tools@4 --unsafe-perm true
      - name: Publicar con func azure functionapp publish (no Azure/functions-action)
        run: func azure functionapp publish "${{ vars.AZURE_FUNCTION_APP_NAME }}" --python
